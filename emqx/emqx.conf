## Node — obrigatório para o EMQX iniciar em container Docker
node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "/opt/emqx/data"
}

## Autorização: permite tudo a clientes autenticados (sem ACL restritiva)
authorization {
  no_match = allow
  deny_action = ignore
}

## Autenticação: exige usuário/senha via banco interno
## Conexões anônimas são rejeitadas automaticamente
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
  }
]

## Listener MQTT TCP (plain — TLS é terminado pelo Traefik)
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024
}

## Dashboard HTTP
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
  }
}
